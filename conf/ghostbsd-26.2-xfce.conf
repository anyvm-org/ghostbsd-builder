# GhostBSD 26.2 (XFCE, community image).
#
# Same install flow as the MATE image (conf/ghostbsd-26.2.conf); only the live
# ISO differs. The installer clones whatever desktop is on the live media, so
# the same conf/pcinstall.cfg and hooks/installOpts.sh produce an XFCE system.

VM_ISO_LINK="https://download.ghostbsd.org/releases/amd64/26.2-R15.1p6/GhostBSD-26.2-R15.1p6-XFCE.iso"

VM_OS_NAME="ghostbsd"
VM_SSH_PORT=2229
VM_RELEASE=26.2-xfce

VM_DISK="ide"

VM_ROOT_PASSWORD="anyvm.org"
VM_USE_SSHROOT_BUILD_SSH=1

# See conf/ghostbsd-26.2.conf -- OCR renders the getty "login:" as "logi".
VM_LOGIN_TAG="logi"

# See conf/ghostbsd-26.2.conf -- boot the live ISO single-user to get past
# the GUI installer that the live rc starts.
VM_LIVE_SINGLE_USER=1

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"

VM_INSTALL_CMD="pkg install -y "

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="fusefs-sshfs"

VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG GhostBSD-nfs"

VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"